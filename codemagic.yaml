# WDT_IOS1_CODEMAGIC_JDT_RELEASE_20261113_BEGIN
# Release identity and credentials are inherited from jdt/codemagic.yaml.
# Keep secrets in the existing appstore_credentials group, never in this file.
workflows:
  ios-bluestoneim-release:
    name: WenDaTong iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - appstore_credentials
      vars:
        APP_NAME: 问达通
        APPLE_BUNDLE_ID_NAME: Wen Da Tong
        XCODE_PROJECT: WenDaTong.xcodeproj
        XCODE_SCHEME: WenDaTong
        XCODE_CONFIG: Release
        BUNDLE_ID: com.wendatongqiye.app
        # Release marketing version; keep in sync with the app's next store version.
        APP_VERSION: "1.0.6"
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: master
          include: true
          source: true
    scripts:
      - name: Validate Codemagic variables
        script: |
          set -euo pipefail
          test -n "${APP_STORE_CONNECT_PRIVATE_KEY:-}" || { echo "Missing APP_STORE_CONNECT_PRIVATE_KEY"; exit 1; }
          test -n "${APP_STORE_CONNECT_KEY_IDENTIFIER:-}" || { echo "Missing APP_STORE_CONNECT_KEY_IDENTIFIER"; exit 1; }
          test -n "${APP_STORE_CONNECT_ISSUER_ID:-}" || { echo "Missing APP_STORE_CONNECT_ISSUER_ID"; exit 1; }
          test -n "${APPLE_TEAM_ID:-}" || { echo "Missing the official APPLE_TEAM_ID in appstore_credentials"; exit 1; }
          test -n "${CERTIFICATE_PRIVATE_KEY:-}" || { echo "Missing CERTIFICATE_PRIVATE_KEY"; exit 1; }
          test "$APPLE_TEAM_ID" != "A3PN7W63G3" || { echo "Use the official submission Team ID, not the local test Team ID"; exit 1; }
          [[ "${BUILD_NUMBER:-}" =~ ^[0-9]+$ ]] || { echo "Missing or invalid Codemagic BUILD_NUMBER"; exit 1; }
          test -f "$CM_BUILD_DIR/$XCODE_PROJECT/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          test -f "$CM_BUILD_DIR/scripts/codemagic-enable-apns.sh"

      - name: Prepare App Store release identity
        script: |
          set -euo pipefail
          # Modify only the app's Release settings in the disposable CI checkout.
          # This must precede use-profiles so profiles match the production bundle.
          ruby <<'RUBY'
          require "xcodeproj"
          project = Xcodeproj::Project.open(File.join(ENV.fetch("CM_BUILD_DIR"), ENV.fetch("XCODE_PROJECT")))
          target = project.targets.find { |item| item.name == "WenDaTong" && item.product_type == "com.apple.product-type.application" }
          abort "WenDaTong app target is missing" unless target
          configuration = target.build_configurations.find { |item| item.name == ENV.fetch("XCODE_CONFIG") }
          abort "Release configuration is missing" unless configuration && configuration.name == "Release"
          settings = configuration.build_settings
          settings["PRODUCT_BUNDLE_IDENTIFIER"] = ENV.fetch("BUNDLE_ID")
          settings["DEVELOPMENT_TEAM"] = ENV.fetch("APPLE_TEAM_ID")
          settings["MARKETING_VERSION"] = ENV.fetch("APP_VERSION")
          settings["CURRENT_PROJECT_VERSION"] = ENV.fetch("BUILD_NUMBER")
          settings["APP1_VERIFY_BUNDLE_ID"] = ENV.fetch("BUNDLE_ID")
          settings["APP1_VERIFY_TEAM_ID"] = ENV.fetch("APPLE_TEAM_ID")
          project.save
          RUBY

      - name: Resolve Swift Package dependencies
        script: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Install Metal Toolchain
        script: |
          xcodebuild -downloadComponent MetalToolchain

      - name: Set up temporary keychain
        script: |
          keychain initialize

      - name: Enable APNs capability
        script: |
          bash "$CM_BUILD_DIR/scripts/codemagic-enable-apns.sh"

      - name: Fetch signing files
        script: |
          set -euo pipefail
          certificate_key_path="$(mktemp "${TMPDIR:-/tmp}/codemagic-certificate.XXXXXX")"
          trap 'rm -f "$certificate_key_path"' EXIT
          python3 - "$certificate_key_path" <<'PY'
          import os
          import sys

          raw_key = os.environ["CERTIFICATE_PRIVATE_KEY"]
          normalized_key = raw_key.replace("\\n", "\n").replace("\r\n", "\n").replace("\r", "\n").strip() + "\n"
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              handle.write(normalized_key)
          PY
          chmod 600 "$certificate_key_path"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --strict-match-identifier \
            --delete-stale-profiles \
            --certificate-key "@file:$certificate_key_path" \
            --create

      - name: Set up signing certificate
        script: |
          keychain add-certificates

      - name: Apply code signing settings
        script: |
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT"

      - name: Build signed IPA
        script: |
          set -euo pipefail
          export APP1_VERIFY_BUNDLE_ID="$BUNDLE_ID"
          export APP1_VERIFY_TEAM_ID="$APPLE_TEAM_ID"
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config "$XCODE_CONFIG" \
            --clean \
            --archive-flags="-disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile" \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER DEVELOPMENT_TEAM=$APPLE_TEAM_ID"

      - name: Verify signed archive identity
        script: |
          set -euo pipefail
          apps=("$CM_BUILD_DIR"/build/ios/xcarchive/*.xcarchive/Products/Applications/WenDaTong.app)
          test "${#apps[@]}" -eq 1 && test -d "${apps[0]}" || { echo "Expected one signed WenDaTong archive"; exit 1; }
          APP1_VERIFY_BUNDLE_ID="$BUNDLE_ID" APP1_VERIFY_TEAM_ID="$APPLE_TEAM_ID" \
            python3 "$CM_BUILD_DIR/scripts/verify_app1_archive.py" --mode formal "${apps[0]}"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # Upload only, matching jdt. Do not submit either review automatically.
        submit_to_testflight: false
        submit_to_app_store: false
# WDT_IOS1_CODEMAGIC_JDT_RELEASE_20261113_END
